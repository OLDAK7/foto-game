<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Повтори фото</title>
    <link rel="stylesheet" href="./css/font-awesome.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000b0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 2500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category-row {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .category-label {
            width: 300px;
            padding: 15px;
            background-color: #000;
            color: #fdd835;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            gap: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 18px;
        }

        .cards-container {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            flex-wrap: wrap;
        }

        .photo-card {
            padding: 10px;
            background-color: #222;
            color: #fff;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            justify-content: space-evenly;
            align-items: flex-start;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
            border: 2px solid transparent;
        }

        .photo-card:hover:not(.disabled) {
            background-color: #444;
            transform: scale(1.05);
        }

        .card-stars {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 0;
            position: absolute;
            bottom: 5%;
            right: 3%;
        }

        .card-number {
            font-size: 25px;
            font-weight: bold;
            border: 2px solid #fff;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-card.disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }
        .photo-card.disabled .card-stars {
            color: #888;
        }
        .photo-card.disabled .card-number {
            border-color: #888;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            position: relative;
            max-width: 100%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 6px;
        }

        .close-btn {
            margin-top: 15px;
            padding: 10px 25px;
            background-color: #fdd835;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover {
            background-color: #c62828;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Повтори фото</h1>
        <div class="game-grid" id="gameGrid">
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <img id="modalImage" src="" alt="Скрытое фото">
            <button class="close-btn" id="closeModalBtn">Закрыть</button>
        </div>
    </div>

    <script>
        const gameData = [
            {
                category: "Йога",
                items: [
                    { id: 1, stars: "★", image: "./fotos/yoga_1.webp" },
                    { id: 2, stars: "★★", image: "./fotos/yoga_2.webp" },
                    { id: 3, stars: "★★★", image: "./fotos/yoga_3.webp" },
                    { id: 4, stars: "★★★★", image: "./fotos/yoga_4.jpg" },
                    { id: 5, stars: "★★★★★", image: "./fotos/yoga_5.jpg" }
                ]
            },
            {
                category: "Модели",
                items: [
                    { id: 1, stars: "★", image: "./fotos/models_1.jpg" },
                    { id: 2, stars: "★★", image: "./fotos/models_2.jpg" },
                    { id: 3, stars: "★★★", image: "./fotos/models_3.jpg" },
                    { id: 4, stars: "★★★★", image: "./fotos/models_4.jpg" },
                    { id: 5, stars: "★★★★★", image: "./fotos/models_5.jpg" }
                ]
            },
            {
                category: "Спорт",
                items: [
                    { id: 1, stars: "★", image: "./fotos/sport_1.jpg" },
                    { id: 2, stars: "★★", image: "./fotos/sport_2.jpg" },
                    { id: 3, stars: "★★★", image: "./fotos/sport_3.jpg" },
                    { id: 4, stars: "★★★★", image: "./fotos/sport_4.webp" },
                    { id: 5, stars: "★★★★★", image: "./fotos/sport_5.webp" }
                ]
            },
            {
                category: "Фильмы",
                items: [
                    { id: 1, stars: "★", image: "./fotos/films_1.webp" },
                    { id: 2, stars: "★★", image: "./fotos/films_2.webp" },
                    { id: 3, stars: "★★★", image: "./fotos/films_3.jpeg" },
                    { id: 4, stars: "★★★★", image: "./fotos/films_4.jpg" },
                    { id: 5, stars: "★★★★★", image: "./fotos/films_5.jpg" }
                ]
            }
        ];

        const gameGrid = document.getElementById('gameGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImage = document.getElementById('modalImage');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        let currentActiveCard = null;

        function initGame() {
            gameData.forEach(rowData => {
                const row = document.createElement('div');
                row.className = 'category-row';

                const label = document.createElement('div');
                label.className = 'category-label';
                label.innerHTML = `<i class="fa fa-video-camera fa-5x" aria-hidden="true"></i> <span>${rowData.category}</span>`;
                row.appendChild(label);

                const cardsContainer = document.createElement('div');
                cardsContainer.className = 'cards-container';

                rowData.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    
                    card.innerHTML = `
                        <i class="fa fa-5x fa-camera" aria-hidden="true"></i>
                        <div class="card-stars">${item.stars}</div>
                        <div class="card-number">${item.id}</div>
                    `;

                    card.addEventListener('click', () => {
                        if (!card.classList.contains('disabled')) {
                            openModal(item.image, card);
                        }
                    });

                    cardsContainer.appendChild(card);
                });

                row.appendChild(cardsContainer);
                gameGrid.appendChild(row);
            });
        }

        function openModal(imageSrc, cardElement) {
            modalImage.src = imageSrc;
            modalOverlay.classList.add('active');
            currentActiveCard = cardElement;
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            
            if (currentActiveCard) {
                currentActiveCard.classList.add('disabled');
                currentActiveCard = null;
            }
            
            setTimeout(() => { modalImage.src = ""; }, 300);

            checkGameEnd();
        }

        function checkGameEnd() {
            const allCards = document.querySelectorAll('.photo-card');
            const disabledCards = document.querySelectorAll('.photo-card.disabled');
            
            if (allCards.length === disabledCards.length) {
                setTimeout(() => {
                    alert('Спасибо за игру! Теперь бухать!))');
                }, 500);
            }
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        initGame();
    </script>
</body>
</html>
